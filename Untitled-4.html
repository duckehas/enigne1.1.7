<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Engine 6.0 Executor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Background: animated 3D lines */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      background-image: 
        linear-gradient(rgba(255, 0, 0, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 0, 0.2) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: moveGrid 10s linear infinite;
      z-index: -1;
    }

    @keyframes moveGrid {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Custom Cursor: Red Dot with Circle (SVG) */
    body {
      cursor: url('cursor.svg'), auto; /* Reference the cursor.svg file in the root */
    }

    /* Loader */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1b1b1b;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }

    #loading-bar {
      width: 0;
      height: 5px;
      background: white;
      transition: width 3s ease-in-out;
    }

    /* Main Content */
    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    #buy-section button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: white;
      color: red;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    #buy-section button:hover {
      background-color: #ddd;
    }

    footer {
      margin-top: 30px;
    }

    footer a {
      color: white;
      text-decoration: underline;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loader">
    <div id="loading-bar"></div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <header>
      <h1>Engine 6.0 Executor</h1>
      <p>The ultimate tool for powerful scripting</p>
    </header>

    <section id="buy-section">
      <h2>Buy Now</h2>
      <p>Purchase Engine 6.0 for the best performance.</p>
      <button onclick="alert('Redirect to payment page')">Buy Engine 6.0</button>
    </section>

    <footer>
      <a href="https://discord.gg/HeECjfNs" target="_blank">Join our Discord</a>
    </footer>
  </div>

  <script>
    window.addEventListener("load", () => {
      const loadingBar = document.getElementById("loading-bar");
      const loader = document.getElementById("loader");
      const mainContent = document.getElementById("main-content");

      setTimeout(() => {
        loadingBar.style.width = "100%";
      }, 100);

      setTimeout(() => {
        loader.style.display = "none";
        mainContent.style.display = "flex";
      }, 3100);
    });
  </script>
</body>
</html>
